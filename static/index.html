<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediAssist — Riverside Medical Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            color: #1a2332;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Login Screen */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f0 100%);
        }
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
            width: 400px;
            max-width: 90vw;
        }
        .login-card .logo {
            font-size: 32px;
            font-weight: 600;
            color: #0f4c75;
            margin-bottom: 4px;
        }
        .login-card .logo .cross {
            color: #2bbbad;
            margin-right: 6px;
        }
        .login-card .subtitle {
            color: #6b7c93;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .login-card input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        .login-card input:focus {
            border-color: #0f4c75;
        }
        .login-card label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 6px;
        }
        .login-card button {
            width: 100%;
            padding: 12px;
            background: #0f4c75;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 16px;
            transition: background 0.2s;
        }
        .login-card button:hover { background: #0a3a5c; }
        .login-error {
            color: #e53e3e;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
        .disclaimer {
            color: #a0aec0;
            font-size: 11px;
            margin-top: 24px;
        }

        /* Chat Screen */
        .chat-container {
            display: none;
            flex-direction: column;
            height: 100vh;
        }
        .chat-header {
            background: #0f4c75;
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-header .brand {
            font-size: 20px;
            font-weight: 600;
        }
        .chat-header .brand .cross { color: #2bbbad; margin-right: 4px; }
        .chat-header .patient-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .patient-name {
            font-size: 14px;
            opacity: 0.9;
        }
        .chat-header .reset-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
        }
        .chat-header .reset-btn:hover { background: rgba(255,255,255,0.25); }
        .chat-header .logout-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
        }
        .chat-header .logout-btn:hover { background: rgba(255,255,255,0.2); }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #dbeafe;
            color: #1a2332;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: white;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .message-meta {
            font-size: 11px;
            color: #8896a6;
            margin-top: 6px;
        }
        .message-meta .tool-tag {
            display: inline-block;
            background: #edf2f7;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 4px;
            font-family: monospace;
            font-size: 11px;
        }

        .chat-input-area {
            padding: 16px 24px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        .chat-input-area input:focus { border-color: #0f4c75; }
        .chat-input-area button {
            background: #0f4c75;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input-area button:hover { background: #0a3a5c; }
        .chat-input-area button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            font-size: 14px;
            color: #8896a6;
        }
        .typing-indicator .dots span {
            animation: blink 1.4s infinite;
            font-size: 18px;
        }
        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 20% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginScreen">
        <div class="login-card">
            <div class="logo"><span class="cross">&#10010;</span>MediAssist</div>
            <div class="subtitle">Riverside Medical Center Patient Portal</div>
            <label for="patientIdInput">Patient ID</label>
            <input type="text" id="patientIdInput" placeholder="Enter your patient ID (1-10)" autocomplete="off">
            <button onclick="doLogin()">Sign In</button>
            <div class="login-error" id="loginError">Patient not found. Please enter a valid ID (1-10).</div>
            <div class="disclaimer">For demonstration purposes only</div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div class="chat-container" id="chatScreen">
        <div class="chat-header">
            <div class="brand"><span class="cross">&#10010;</span>MediAssist</div>
            <div class="patient-info">
                <span class="patient-name" id="patientNameDisplay"></span>
                <button class="reset-btn" onclick="resetMemory()">Reset Memory</button>
                <button class="logout-btn" onclick="doLogout()">Sign Out</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="typing-indicator" id="typingIndicator">
                <span class="dots"><span>.</span><span>.</span><span>.</span></span> MediAssist is thinking...
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Describe your symptoms or ask a question..." onkeydown="if(event.key==='Enter')sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let patientName = null;
        let conversationHistory = [];

        async function doLogin() {
            const id = document.getElementById('patientIdInput').value.trim();
            const errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';

            if (!id) return;

            try {
                // Step 1: Create a server-side session via POST /login
                const loginResp = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ patient_id: parseInt(id) })
                });
                if (!loginResp.ok) {
                    errorEl.style.display = 'block';
                    return;
                }

                // Step 2: Fetch patient summary (session cookie is now set)
                const patientResp = await fetch(`/patient/${id}`);
                if (!patientResp.ok) {
                    errorEl.style.display = 'block';
                    return;
                }
                const data = await patientResp.json();

                patientName = data.name;
                document.getElementById('patientNameDisplay').textContent = data.name;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('chatScreen').style.display = 'flex';
                conversationHistory = [];
                addMessage('assistant', `Hello, ${data.name.split(' ')[0]}! I'm MediAssist, your healthcare triage assistant. How can I help you today?`, [], null);
                document.getElementById('messageInput').focus();
            } catch (e) {
                errorEl.style.display = 'block';
            }
        }

        async function doLogout() {
            // Clear the server-side session
            try {
                await fetch('/logout', { method: 'POST' });
            } catch (e) {}

            patientName = null;
            conversationHistory = [];
            document.getElementById('chatMessages').innerHTML =
                '<div class="typing-indicator" id="typingIndicator"><span class="dots"><span>.</span><span>.</span><span>.</span></span> MediAssist is thinking...</div>';
            document.getElementById('chatScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('patientIdInput').value = '';
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const msg = input.value.trim();
            if (!msg) return;

            input.value = '';
            addMessage('user', msg, [], null);

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            document.getElementById('typingIndicator').style.display = 'block';
            scrollToBottom();

            try {
                // patient_id is no longer sent — the server reads it from the session
                const resp = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: msg,
                        conversation_history: conversationHistory
                    })
                });
                const data = await resp.json();
                conversationHistory.push({ role: 'user', content: msg });
                conversationHistory.push({ role: 'assistant', content: data.response });
                addMessage('assistant', data.response, data.tool_calls || [], data.request_id);
            } catch (e) {
                addMessage('assistant', 'Sorry, something went wrong. Please try again.', [], null);
            } finally {
                sendBtn.disabled = false;
                document.getElementById('typingIndicator').style.display = 'none';
                input.focus();
            }
        }

        function addMessage(role, text, tools, requestId) {
            const container = document.getElementById('chatMessages');
            const indicator = document.getElementById('typingIndicator');

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.textContent = text;

            if (role === 'assistant') {
                let metaHtml = '';
                if (tools && tools.length > 0) {
                    metaHtml += 'Tools used: ' + tools.map(t => `<span class="tool-tag">${t}</span>`).join(' ');
                }
                if (requestId) {
                    if (metaHtml) metaHtml += '<br>';
                    metaHtml += `Trace ID: <span class="tool-tag">${requestId}</span>`;
                }
                if (metaHtml) {
                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'message-meta';
                    metaDiv.innerHTML = metaHtml;
                    msgDiv.appendChild(metaDiv);
                }
            }

            container.insertBefore(msgDiv, indicator);
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }

        async function resetMemory() {
            try {
                // patient_id no longer needed — server reads from session
                await fetch('/reset', { method: 'POST' });
                addMessage('assistant', 'Session memory has been cleared.', [], null);
            } catch (e) {
                addMessage('assistant', 'Failed to reset memory.', [], null);
            }
        }

        document.getElementById('patientIdInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
